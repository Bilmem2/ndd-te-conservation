# Conda environment for the NDD TE-conservation analysis pipeline.
#
# Create with:
#   conda env create -f environment.yml
#   conda activate bio_master
#
# The pins below are the versions the reported analyses were run under, and
# match the software versions given in the Methods. Nothing in the pipeline
# depends on a specific patch release; the pins are here so a rerun starts from
# a known state, not because the results are fragile to them.
#
# SYSTEM DEPENDENCY (not installed here): BEDTools >= 2.31 must be on PATH —
# see README "Requirements". A few scripts (05_intersect.sh, 08, 09, 10) shell
# out to `bedtools intersect -c`; the later scripts use an equivalent NumPy
# interval routine instead, checked against bedtools on the hg38 CpG-island
# track. RepeatMasker is NOT required: the pipeline parses pre-computed UCSC
# RepeatMasker tracks (rmsk.txt.gz, or repeatMasker.out.gz for mouse lemur), it
# does not run RepeatMasker.

name: bio_master

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.14
  - pandas=2.3.3
  - numpy=2.3.5
  - scipy=1.16.3
  - matplotlib=3.11.0
  - seaborn=0.13.2
  - tqdm=4.67.1
  - requests=2.32.5
  - tabulate=0.10.0           # 22_consolidate.py (Markdown tables)
  - pip
  - pip:
      - twobitreader==4.0.0   # promoter GC from hg38.2bit (18/19/40_*.py)
